      <rect width="64" height="64" fill="#fff"/>
      <path d="M59 32 A27 6.5 0 0 1 5 32" transform="rotate(-24 32 32)" fill="none" stroke="#000" stroke-width="7.5" stroke-linecap="round"/>
    </mask>
  </defs>
  
  <g transform="rotate(-24 32 32)" fill="none" stroke="#f3efe6" stroke-width="3.5" stroke-linecap="round">
    <path d="M5 32 A27 6.5 0 0 1 59 32"/>
  </g>
  <circle cx="32" cy="32" r="14" fill="#7048e5" mask="url(#groove)"/>
  <g transform="rotate(-24 32 32)">
    <path d="M59 32 A27 6.5 0 0 1 5 32" fill="none" stroke="#f3efe6" stroke-width="3.5" stroke-linecap="round"/>
